<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0906">
<title>SunFlix</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top" id="top">
  <a class="logo" href="#/" aria-label="SunFlix home">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
      <defs><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient></defs>
      <g stroke="url(#sun)" stroke-width="2.6" stroke-linecap="round">
        <path d="M16 2v4M16 26v4M2 16h4M26 16h4M6.1 6.1l2.8 2.8M23.1 23.1l2.8 2.8M6.1 25.9l2.8-2.8M23.1 8.9l2.8-2.8"/>
      </g>
      <circle cx="16" cy="16" r="7" fill="url(#sun)"/>
      <path d="M14 12.6v6.8l5.6-3.4z" fill="#0e0c09"/>
    </svg>
    <span><b>Sun</b>Flix</span><span class="logo-tv" role="img" aria-label="TV" title="Click to repaint"></span>
  </a>
  <nav class="nav" aria-label="Library">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/movies" data-nav="movies">Movies</a>
    <a href="#/shows" data-nav="shows">Shows</a>
  </nav>
  <input class="search" id="search" type="search" placeholder="Search" aria-label="Search your library" autocomplete="off">
  <button class="iconbtn" id="rescan" type="button" aria-label="Rescan library" title="Look for new files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.650 6.350A8 8 0 1 0 19.730 14h-2.080A6 6 0 1 1 12 6c1.660 0 3.140.690 4.220 1.780L13 11h7V4z"/></svg></button>
  <button class="ghost" id="login" type="button" hidden>Sign in</button>
  <button class="ghost" id="logout" type="button" hidden>Sign out</button>
</header>
<main id="app"></main>
<script src="/tv.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
