<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Fresh Prince Mansion — Interactive 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; touch-action: none; }
    canvas { display: block; }
    #label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0.85;
    }
    #toggle {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.18);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 11px 28px;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #toggle:active { opacity: 0.7; }
  </style>
</head>
<body>
  <div id="label">The Banks Estate · Bel-Air, CA &nbsp;·&nbsp; Drag to explore</div>
  <button id="toggle">🌙 Night mode</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─── Renderer ─────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // ─── Scene / Camera ───────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xc8dff0, 50, 130);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 9, 26);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 3.5, 0);
    controls.minDistance = 9;
    controls.maxDistance = 55;
    controls.maxPolarAngle = Math.PI / 2 - 0.04;

    // ─── Sky ──────────────────────────────────────────────────────────────────
    const skyGeo = new THREE.SphereGeometry(220, 16, 8);
    skyGeo.scale(-1, 1, 1);
    const skyMat = new THREE.MeshBasicMaterial({ color: 0x87ceeb });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    // ─── Lights ───────────────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xfff0dd, 0.55);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff4cc, 2.4);
    sun.position.set(18, 22, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 110;
    sun.shadow.camera.left = -35;
    sun.shadow.camera.right = 35;
    sun.shadow.camera.top = 35;
    sun.shadow.camera.bottom = -35;
    sun.shadow.bias = -0.001;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xaac8ff, 0.35);
    fill.position.set(-12, 6, -8);
    scene.add(fill);

    // Window glow (night)
    const winLights = [];

    // ─── Materials ────────────────────────────────────────────────────────────
    const M = {
      stucco:   new THREE.MeshLambertMaterial({ color: 0xf3ede0 }),
      roof:     new THREE.MeshLambertMaterial({ color: 0xb04418 }),
      glass:    new THREE.MeshLambertMaterial({ color: 0x5080aa, transparent: true, opacity: 0.65 }),
      door:     new THREE.MeshLambertMaterial({ color: 0x4a2e12 }),
      grass:    new THREE.MeshLambertMaterial({ color: 0x4e8030 }),
      stone:    new THREE.MeshLambertMaterial({ color: 0xc8b89a }),
      trunk:    new THREE.MeshLambertMaterial({ color: 0x6b4522 }),
      frond:    new THREE.MeshLambertMaterial({ color: 0x2a6830 }),
      shrub:    new THREE.MeshLambertMaterial({ color: 0x265020 }),
      water:    new THREE.MeshLambertMaterial({ color: 0x3388cc, transparent: true, opacity: 0.75 }),
      bgTree:   new THREE.MeshLambertMaterial({ color: 0x1c4825 }),
    };

    // ─── Ground ───────────────────────────────────────────────────────────────
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), M.grass);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Circular driveway
    const driveRing = new THREE.Mesh(new THREE.RingGeometry(4, 8.5, 40), M.stone);
    driveRing.rotation.x = -Math.PI / 2;
    driveRing.position.set(0, 0.01, 9);
    scene.add(driveRing);

    // Driveway approach strip
    const approach = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 10), M.stone);
    approach.rotation.x = -Math.PI / 2;
    approach.position.set(0, 0.01, 17);
    scene.add(approach);

    // Low stone border around ring
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * Math.PI * 2;
      const stone = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 0.4), M.stone);
      stone.position.set(Math.cos(a) * 8.8, 0.12, 9 + Math.sin(a) * 8.8);
      stone.castShadow = true;
      scene.add(stone);
    }

    // ─── Mansion body ─────────────────────────────────────────────────────────
    function box(w, h, d, mat, x, y, z, shadow = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      if (shadow) { m.castShadow = true; m.receiveShadow = true; }
      scene.add(m);
      return m;
    }

    // Main block
    box(15, 8.5, 9,  M.stucco, 0,    4.25, -2);
    // Left wing
    box(5.5, 7,  8,  M.stucco, -10,  3.5,  -2);
    // Right wing
    box(5.5, 7,  8,  M.stucco,  10,  3.5,  -2);
    // Second-floor center tower
    box(10,  3.5, 8, M.stucco,   0,  10.25,-2);

    // Roofs (flat hip approximation with layered slabs)
    box(16.5, 1.2, 10.5, M.roof,  0,    8.6,  -2);
    box(15,   0.9,  9,   M.roof,  0,   10.2,  -2);
    box(10.5, 1.2,  9,   M.roof,  0,   12.1,  -2);
    box(6.5,  1.0,  9.5, M.roof, -10,  7.0,  -2);
    box(6.5,  1.0,  9.5, M.roof,  10,  7.0,  -2);

    // Portico / entrance arch
    box(4,  5.5, 2.2, M.stucco, 0, 2.75, 3);
    box(4.8, 0.9, 2.8, M.roof,  0, 5.7,  3);

    // Front door (double)
    box(0.7, 3.2, 0.2, M.door, -0.4, 1.6, 4.1);
    box(0.7, 3.2, 0.2, M.door,  0.4, 1.6, 4.1);

    // Columns
    const colGeo = new THREE.CylinderGeometry(0.22, 0.26, 5.5, 10);
    [-1.3, 0, 1.3].forEach(x => {
      const col = new THREE.Mesh(colGeo, M.stucco);
      col.position.set(x, 2.75, 4.0);
      col.castShadow = true;
      scene.add(col);
    });

    // ─── Windows ──────────────────────────────────────────────────────────────
    const winGeo = new THREE.BoxGeometry(1.3, 2, 0.15);
    const winDefs = [
      // Ground floor main
      [-5, 4.5, 2.1], [-2.5, 4.5, 2.1], [2.5, 4.5, 2.1], [5, 4.5, 2.1],
      // Second floor
      [-4, 8.2, 2.1], [-1.5, 8.2, 2.1], [1.5, 8.2, 2.1], [4, 8.2, 2.1],
      // Tower
      [-3, 10.5, 2.1], [0, 10.5, 2.1], [3, 10.5, 2.1],
      // Wings
      [-10, 3.5, 2.1], [10, 3.5, 2.1],
    ];

    winDefs.forEach(([x, y, z]) => {
      const win = new THREE.Mesh(winGeo, M.glass);
      win.position.set(x, y, z);
      scene.add(win);

      // Night point light behind each window
      const wl = new THREE.PointLight(0xffcc66, 0, 4);
      wl.position.set(x, y, z - 0.5);
      scene.add(wl);
      winLights.push(wl);
    });

    // ─── Fountain ─────────────────────────────────────────────────────────────
    const fBase = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.5, 0.45, 28), M.stone);
    fBase.position.set(0, 0.22, 9);
    fBase.castShadow = true;
    scene.add(fBase);

    const fPool = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 0.18, 28), M.water);
    fPool.position.set(0, 0.49, 9);
    scene.add(fPool);

    const fSpire = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.1, 8), M.stone);
    fSpire.position.set(0, 0.88, 9);
    scene.add(fSpire);

    // Fountain particle jet
    const PCOUNT = 100;
    const pPos = new Float32Array(PCOUNT * 3);
    const pVel = [];
    function resetParticle(i) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.25;
      pPos[i * 3]     = Math.cos(a) * r;
      pPos[i * 3 + 1] = 1.0;
      pPos[i * 3 + 2] = 9 + Math.sin(a) * r;
      pVel[i] = {
        vx: Math.cos(a) * (0.008 + Math.random() * 0.012),
        vy: 0.045 + Math.random() * 0.03,
        vz: Math.sin(a) * (0.008 + Math.random() * 0.012),
        life: Math.random(),
      };
    }
    for (let i = 0; i < PCOUNT; i++) resetParticle(i);
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x99ccff, size: 0.13, transparent: true, opacity: 0.72 });
    const jets = new THREE.Points(pGeo, pMat);
    scene.add(jets);

    // ─── Palms ────────────────────────────────────────────────────────────────
    const palmGroups = [];
    function makePalm(x, z, height = 5) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.userData.swayPhase = Math.random() * Math.PI * 2;
      // Trunk segments
      const segs = 7;
      const lean = { x: (Math.random() - 0.5) * 0.12, z: (Math.random() - 0.5) * 0.12 };
      g.userData.lean = lean;
      for (let i = 0; i < segs; i++) {
        const r = 0.17 - i * 0.012;
        const seg = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.016, height / segs, 8), M.trunk);
        seg.position.set(lean.x * i * 0.4, (i + 0.5) * (height / segs), lean.z * i * 0.4);
        seg.castShadow = true;
        g.add(seg);
      }
      // Fronds
      const tipX = lean.x * segs * 0.4;
      const tipZ = lean.z * segs * 0.4;
      const tipY = height;
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2;
        const frond = new THREE.Mesh(new THREE.SphereGeometry(1.0, 6, 4), M.frond);
        frond.scale.set(2.0, 0.28, 0.55);
        frond.position.set(tipX + Math.cos(a) * 1.4, tipY + 0.15, tipZ + Math.sin(a) * 1.4);
        frond.rotation.z = Math.cos(a) * 0.45;
        frond.rotation.x = Math.sin(a) * 0.45;
        frond.castShadow = true;
        g.add(frond);
      }
      scene.add(g);
      palmGroups.push(g);
    }

    makePalm(-11, 4.5, 5.5);
    makePalm( 11, 4.5, 5.5);
    makePalm(-14,  0,  5);
    makePalm( 14,  0,  5);
    makePalm( -8, 13,  5);
    makePalm(  8, 13,  5);
    makePalm(-18, -4,  6.5);
    makePalm( 18, -4,  6.5);

    // ─── Hedges / shrubs ──────────────────────────────────────────────────────
    const shrubGeo = new THREE.SphereGeometry(0.75, 7, 5);
    [-5.5, -3.8, -2.2, 2.2, 3.8, 5.5].forEach(x => {
      const s = new THREE.Mesh(shrubGeo, M.shrub);
      s.position.set(x, 0.55, 5.5);
      s.scale.set(1, 0.78, 0.75);
      s.castShadow = true;
      scene.add(s);
    });

    // ─── Background treeline ──────────────────────────────────────────────────
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const r = 28 + Math.random() * 12;
      const h = 4 + Math.random() * 5;
      const t = new THREE.Mesh(new THREE.ConeGeometry(1.6 + Math.random() * 0.6, h, 7), M.bgTree);
      t.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
      t.castShadow = true;
      scene.add(t);
    }

    // ─── Day/Night toggle ─────────────────────────────────────────────────────
    let night = false;
    const dayFogColor  = new THREE.Color(0xc8dff0);
    const nightFogColor = new THREE.Color(0x08081a);
    const daySky  = new THREE.Color(0x87ceeb);
    const nightSky = new THREE.Color(0x080818);

    document.getElementById('toggle').addEventListener('click', () => {
      night = !night;
      document.getElementById('toggle').textContent = night ? '☀️ Day mode' : '🌙 Night mode';
    });

    // ─── Animate ──────────────────────────────────────────────────────────────
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = 0.025;

      // Fountain particles
      for (let i = 0; i < PCOUNT; i++) {
        pVel[i].life += 0.009;
        if (pVel[i].life > 1) {
          resetParticle(i);
        } else {
          pPos[i * 3]     += pVel[i].vx;
          pPos[i * 3 + 1] += pVel[i].vy;
          pPos[i * 3 + 2] += pVel[i].vz;
          pVel[i].vy -= 0.0025;
        }
      }
      pGeo.attributes.position.needsUpdate = true;

      // Fountain water shimmer
      fPool.material.opacity = 0.65 + Math.sin(t * 2.8) * 0.12;

      // Palm sway
      palmGroups.forEach(pg => {
        const sway = Math.sin(t * 0.9 + pg.userData.swayPhase) * 0.035;
        pg.children.forEach((child, i) => {
          if (i < 7) child.rotation.z = sway * (i / 7);
        });
      });

      // Day/night lerp
      if (night) {
        scene.fog.color.lerp(nightFogColor, dt);
        skyMat.color.lerp(nightSky, dt);
        ambient.intensity  = THREE.MathUtils.lerp(ambient.intensity,  0.10, dt);
        sun.intensity      = THREE.MathUtils.lerp(sun.intensity,      0.05, dt);
        winLights.forEach(wl => { wl.intensity = THREE.MathUtils.lerp(wl.intensity, 1.6, dt); });
      } else {
        scene.fog.color.lerp(dayFogColor, dt);
        skyMat.color.lerp(daySky, dt);
        ambient.intensity  = THREE.MathUtils.lerp(ambient.intensity,  0.55, dt);
        sun.intensity      = THREE.MathUtils.lerp(sun.intensity,      2.4,  dt);
        winLights.forEach(wl => { wl.intensity = THREE.MathUtils.lerp(wl.intensity, 0, dt); });
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // ─── Resize ───────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
